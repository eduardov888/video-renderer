<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Kinetic Type Demo — Utilis AI</title>
<script src="../vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #111;
    background: #FFD60A;
  }
  /* Moving gradient background */
  #bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #FFD60A 0%, #FF9F1C 25%, #FF5C8A 55%, #7B5CFF 80%, #00C2FF 100%);
    background-size: 300% 300%;
    background-position: 0% 0%;
  }
  .blob {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.28);
    filter: blur(2px);
  }
  #blob1 { width: 420px; height: 420px; top: 180px; left: -120px; }
  #blob2 { width: 300px; height: 300px; top: 900px; right: -80px; }
  #blob3 { width: 220px; height: 220px; bottom: 320px; left: 120px; background: rgba(255,255,255,0.18); }

  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 90px 70px 140px;
    text-align: center;
  }
  #headline { line-height: 0.95; letter-spacing: -2px; }
  #headline .line { display: block; font-size: 205px; font-weight: 900; }
  #headline .line.alt { color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,0.12); }
  #headline .line.small { font-size: 120px; letter-spacing: -1px; }

  #subline {
    margin-top: 44px; font-size: 46px; font-weight: 900;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111; color: #FFD60A;
    padding: 18px 34px; border-radius: 16px;
  }

  #diagram {
    margin-top: 64px; width: 100%;
    background: rgba(255,255,255,0.94);
    border-radius: 28px; padding: 44px 48px 52px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    text-align: left;
  }
  #diagram h2 {
    font-size: 40px; letter-spacing: 1px; margin-bottom: 34px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .bar-row { margin-bottom: 30px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label {
    display: flex; justify-content: space-between;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 32px; font-weight: 800; margin-bottom: 10px;
  }
  .bar-track { height: 34px; background: #E8E4D8; border-radius: 17px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; border-radius: 17px; }
  #fill1 { background: #FF5C8A; }
  #fill2 { background: #7B5CFF; }
  #fill3 { background: #00B140; }

  #logo {
    margin-top: 64px; font-size: 96px; letter-spacing: 2px;
    color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  #logo span { color: #111; }
  #cta {
    margin-top: 26px; font-size: 40px; font-weight: 900;
    font-family: "Helvetica Neue", Arial, sans-serif; color: #fff;
  }

  /* Progress bar */
  #progress {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
    background: rgba(0,0,0,0.25);
  }
  #progressFill { height: 100%; width: 0%; background: #111; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="blob" id="blob1"></div>
  <div class="blob" id="blob2"></div>
  <div class="blob" id="blob3"></div>

  <div id="stage">
    <div id="headline">
      <span class="line" id="w1">ONE</span>
      <span class="line alt" id="w2">TOOL</span>
      <span class="line small" id="w3">AT A TIME.</span>
    </div>
    <div id="subline">Result first. Then the exact steps.</div>

    <div id="diagram">
      <h2>TIME TO LEARN ONE TOOL</h2>
      <div class="bar-row">
        <div class="bar-label"><span>BEFORE</span><span>2 hours</span></div>
        <div class="bar-track"><div class="bar-fill" id="fill1"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>WITH AI</span><span>20 minutes</span></div>
        <div class="bar-track"><div class="bar-fill" id="fill2"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>WITH UTILIS AI</span><span>90 seconds</span></div>
        <div class="bar-track"><div class="bar-fill" id="fill3"></div></div>
      </div>
    </div>

    <div id="logo">UTILIS<span> AI</span></div>
    <div id="cta">Follow for one tool a day.</div>
  </div>

  <div id="progress"><div id="progressFill"></div></div>

<script>
  // All motion is driven by the virtual clock: window.__renderFrame(t).
  // A paused GSAP timeline holds every tween; seeking it to t renders the
  // exact state at that second — fully deterministic, frame by frame.
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

  tl.fromTo("#w1", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.15)
    .fromTo("#w2", { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4 }, 0.65)
    .fromTo("#w3", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4 }, 1.15)
    .fromTo("#subline", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.9)
    .to("#headline", { y: -24, duration: 0.5 }, 2.8)
    .fromTo("#diagram", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 3.0)
    .to("#fill1", { width: "22%", duration: 0.7, ease: "power2.inOut" }, 3.6)
    .to("#fill2", { width: "58%", duration: 0.7, ease: "power2.inOut" }, 3.85)
    .to("#fill3", { width: "100%", duration: 0.7, ease: "power2.inOut" }, 4.1)
    .fromTo("#logo", { scale: 0.6, rotation: -6, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 6.0)
    .fromTo("#cta", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 7.0);

  const bg = document.getElementById("bg");
  const b1 = document.getElementById("blob1");
  const b2 = document.getElementById("blob2");
  const b3 = document.getElementById("blob3");
  const progressFill = document.getElementById("progressFill");

  // Called by the renderer before every screenshot, t in seconds.
  window.__renderFrame = function (t) {
    tl.time(t);
    // Moving gradient: drift the background position across the full 10s.
    bg.style.backgroundPosition = (t / 10 * 100).toFixed(2) + "% " + (t / 10 * 60).toFixed(2) + "%";
    // Floating blobs on slow sine paths.
    b1.style.transform = "translate(" + (Math.sin(t * 0.9) * 130).toFixed(1) + "px," + (Math.cos(t * 0.7) * 170).toFixed(1) + "px)";
    b2.style.transform = "translate(" + (Math.cos(t * 0.8) * 110).toFixed(1) + "px," + (Math.sin(t * 1.1) * 140).toFixed(1) + "px)";
    b3.style.transform = "translate(" + (Math.sin(t * 1.3 + 2) * 90).toFixed(1) + "px," + (Math.cos(t * 0.6 + 1) * 120).toFixed(1) + "px)";
    // Progress bar: 0 -> 100% over the whole video.
    progressFill.style.width = (t / 10 * 100).toFixed(2) + "%";
  };

  // Initial state for a live browser preview (t = 0).
  window.__renderFrame(0);
</script>
</body>
</html>
